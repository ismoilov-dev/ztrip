events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Required for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream django_web {
        server web:8000;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    # ==========================================
    # DJANGO APP & WEBSOCKETS (api.yourdomain.com)
    # ==========================================
    server {
        listen 80;
        server_name api.yourdomain.com;

        # Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force HTTPS (Uncomment after setting up SSL)
        # return 301 https://$host$request_uri;

        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (Crucial for AI Voice)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Prevent timeout for long-running voice sessions
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }

    # ==========================================
    # MINIO S3 API (s3.yourdomain.com)
    # ==========================================
    server {
        listen 80;
        server_name s3.yourdomain.com;
        
        # Max upload size for AI models/audio files
        client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://minio_s3;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300;
        }
    }
}